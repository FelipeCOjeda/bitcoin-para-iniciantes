name: Atualizar playlist

on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas
  workflow_dispatch: {}       # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar-playlist
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar vídeos da playlist
        run: python scripts/update_playlist.py
      - name: Commit se houve mudança
        run: |
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "Atualiza lista de vídeos da playlist"
            git push
          else
            echo "Sem mudanças"
          fi
